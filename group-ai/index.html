  :root{--paper:#f2f5ff;--surface:#fff;--ink:#222;--ink-2:#666;--muted:#888;--line:#e5e5e5;--accent:#1428a0;--accent-hover:#273bba}

  html{color-scheme:light dark}
  body{margin:0;background:var(--paper);color:var(--ink);word-break:keep-all;letter-spacing:-.02em;
       font-family:"Spoqa Han Sans Neo",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  main{max-width:40rem;margin:12vh auto 0;padding:0 1.5rem 4rem}

  ol{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
  li+li{border-top:1px solid var(--line)}
  a{display:flex;align-items:baseline;gap:1rem;padding:1.05rem 1.2rem;color:inherit;text-decoration:none;font-size:1.05rem;font-weight:700}
  a b{font:500 .78rem "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;color:var(--accent);flex:0 0 auto}
  a small{margin-left:auto;font:400 .75rem "IBM Plex Mono",ui-monospace,monospace;color:var(--muted)}
  a:hover,a:focus-visible{background:var(--paper);outline:none;color:var(--accent)}
